<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        #gameContainer {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 420px;
            max-width: 90vw;
            margin: 20px auto;
            box-sizing: border-box;
        }
        canvas {
            background-color: #000;
            border: 2px solid #fff;
            display: block;
            margin: 10px auto;
            max-width: 100%;
            touch-action: none;
        }
        .score-board {
            font-size: 18px;
            margin-bottom: 10px;
        }
        button.start-btn {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button.start-btn:hover {
            background-color: #45a049;
        }

        /* 十字方向鍵樣式 */
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
        }
        .btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }
        .btn:active {
            background-color: #4CAF50;
            color: #000;
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

<div id="gameContainer">
    <h2>🐍 經典貪吃蛇遊戲</h2>
    <div class="score-board">分數: <span id="score">0</span></div>
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    <button class="start-btn" onclick="startGame()">重新開始</button>

    <!-- 手機按鈕區域 -->
    <div class="controls">
        <button class="btn btn-up" onclick="setDirection('UP')">⬆️</button>
        <button class="btn btn-left" onclick="setDirection('LEFT')">⬅️</button>
        <button class="btn btn-down" onclick="setDirection('DOWN')">⬇️</button>
        <button class="btn btn-right" onclick="setDirection('RIGHT')">➡️</button>
    </div>

    <p style="font-size: 12px; color: #aaa; margin-top: 15px;">使用鍵盤方向鍵、螢幕按鈕或滑動控制移動</p>
</div>

<script>
    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let gameInterval = null;
    let changingDirection = false;
    let isGameRunning = false;

    function startGame() {
        snake = [
            { x: 160, y: 200 },
            { x: 140, y: 200 },
            { x: 120, y: 200 }
        ];
        score = 0;
        dx = gridSize;
        dy = 0;
        scoreDisplay.innerText = score;
        isGameRunning = true;
        generateFood();
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 160);
    }

    function gameLoop() {
        if (isGameOver()) {
            clearInterval(gameInterval);
            isGameRunning = false;
            alert("遊戲結束！最終得分: " + score);
            return;
        }

        changingDirection = false;
        clearCanvas();
        drawFood();
        moveSnake();
        drawSnake();
    }

    function clearCanvas() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? "#4CAF50" : "#81C784";
            ctx.strokeStyle = "#000";
            ctx.fillRect(part.x, part.y, gridSize, gridSize);
            ctx.strokeRect(part.x, part.y, gridSize, gridSize);
        });
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreDisplay.innerText = score;
            generateFood();
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount) * gridSize;
        food.y = Math.floor(Math.random() * tileCount) * gridSize;

        snake.forEach(part => {
            if (part.x === food.x && part.y === food.y) {
                generateFood();
            }
        });
    }

    function drawFood() {
        ctx.fillStyle = "#FF5252";
        ctx.fillRect(food.x, food.y, gridSize, gridSize);
    }

    function isGameOver() {
        const head = snake[0];

        const hitLeftWall = head.x < 0;
        const hitRightWall = head.x >= canvas.width;
        const hitTopWall = head.y < 0;
        const hitBottomWall = head.y >= canvas.height;

        if (hitLeftWall || hitRightWall || hitTopWall || hitBottomWall) {
            return true;
        }

        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                return true;
            }
        }

        return false;
    }

    // 方向設定（按鈕與手勢共通）
    function setDirection(dir) {
        if (changingDirection || !isGameRunning) return;

        const goingUp = dy === -gridSize;
        const goingDown = dy === gridSize;
        const goingRight = dx === gridSize;
        const goingLeft = dx === -gridSize;

        if (dir === 'LEFT' && !goingRight) { dx = -gridSize; dy = 0; changingDirection = true; }
        if (dir === 'UP' && !goingDown) { dx = 0; dy = -gridSize; changingDirection = true; }
        if (dir === 'RIGHT' && !goingLeft) { dx = gridSize; dy = 0; changingDirection = true; }
        if (dir === 'DOWN' && !goingUp) { dx = 0; dy = gridSize; changingDirection = true; }
    }

    // 電腦鍵盤控制
    document.addEventListener("keydown", (event) => {
        const LEFT_KEY = 37, RIGHT_KEY = 39, UP_KEY = 38, DOWN_KEY = 40;
        if (event.keyCode === LEFT_KEY) setDirection('LEFT');
        if (event.keyCode === UP_KEY) setDirection('UP');
        if (event.keyCode === RIGHT_KEY) setDirection('RIGHT');
        if (event.keyCode === DOWN_KEY) setDirection('DOWN');

        if ([LEFT_KEY, RIGHT_KEY, UP_KEY, DOWN_KEY].includes(event.keyCode)) {
            event.preventDefault();
        }
    });

    // 手機畫面手勢滑動輔助控制
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, false);

    canvas.addEventListener('touchend', (e) => {
        let diffX = e.changedTouches[0].clientX - touchStartX;
        let diffY = e.changedTouches[0].clientY - touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 20) setDirection('RIGHT');
            else if (diffX < -20) setDirection('LEFT');
        } else {
            if (diffY > 20) setDirection('DOWN');
            else if (diffY < -20) setDirection('UP');
        }
    }, false);

    clearCanvas();
</script>
</body>
</html>
